<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Assistant</title>
<!--
  ===========================================================================
  MODALITY STUDY - CHATBOT CONDITION
  Standalone page. No backend. Nothing is transmitted to or stored by the host.

  HOW DATA LEAVES THIS PAGE
  Answers are hashed in the browser and never transmitted in plaintext.
  At completion the derived values are appended to the QuestionPro survey URL
  as custom variables and the participant is sent there by clicking through.

  ENCODING (fixed width, positional by question, alphanumeric only,
  because QuestionPro disallows commas and hashes in custom variables and
  advises alphanumeric values only; each variable holds max 512 chars)

    pid    Prolific ID, passed through from the inbound URL
    cond   always "chatbot"
    t0     epoch ms when START was accepted
    fin    epoch ms at completion
    dis    21 chars, 1 = answered, 0 = not answered
    skp    21 chars, n = answered, b = skip button,
                     e = typed the bare word, s = typed it in a sentence
    rep    21 digits, empty-submission re-prompt count per question, capped at 9
    lat    21 x 6 digits, zero padded ms from question shown to submission,
           capped at 999999
    hsh    21 x 16 hex chars run together, 336 total.
           Sixteen zeros where nothing was disclosed.
           SALTED with a random per-session value that is never transmitted,
           so answers cannot be recovered by brute force. Hashes are
           comparable within one participant but not between participants.
    ref    21 chars, 1 = the typed answer looked like a refusal ("no" on a
           question where no is not an answer, "rather not say", "n/a").
           Recorded at entry, because the plaintext is gone afterwards.
           dis stays 1 for these: the flag is advisory, so disclosure can be
           reported counting them either way.

    len    21 x 2 digits, characters typed per question, zero padded, capped
           at 99. "00" where nothing was answered. Length only, never content:
           it identifies nobody and cannot assist a brute-force attack with the
           salt discarded. Its purpose is spotting implausible answers (a
           2-character maiden name, a 30-character age) in analysis.
           Slice [(N-1)*2 : N*2].

    nstop  number of times STOP was raised and then withdrawn
    done   1 if the participant reached the end

    ATTENTION CHECKS (kept out of the 21-position encoding on purpose)
    att    3 chars, one per check in order: 1 pass, 0 fail, s skipped,
           x not reached. Checks sit after questions 7, 14 and 17.
    attlat 3 x 6 digits, zero padded ms
    att1   normalised answer to check 1 ("What is 7+8?")
    att2   normalised answer to check 2 (instructed response: type 'blue')
    att3   normalised answer to check 3 ("How many days are there in a week?")
           Not hashed. Lowercased, non-alphanumeric stripped, 40 char cap.

  X PREFIX: t0, fin, dis, rep, lat, hsh, att and attlat arrive with a
  leading "X" so no spreadsheet can read them as numbers. Excel would
  otherwise drop leading zeros (shifting every position) or turn long digit
  strings into scientific notation, silently. Drop the first character
  before unpacking. skp, pid, cond, nstop, done and att1-3 have no prefix.

  Unpack with fixed-width slicing AFTER removing the X: question N
  (1-indexed) is
    dis[N-1], skp[N-1], rep[N-1], lat[(N-1)*6 : N*6], hsh[(N-1)*16 : N*16]

  BEFORE RUNNING
  1. Fill in CONFIG below.
  2. In QuestionPro, define the eleven variable codes in the Variables tab.
     Codes are case sensitive and must match CONFIG.vars exactly.
  3. Serve over http://localhost or https. Opening the file directly with
     file:// will break the hashing, because Web Crypto needs a secure origin.
       python -m http.server
  ===========================================================================
-->
<style>
  :root {
    --page: #f4f5f7;
    --panel: #ffffff;
    --ink: #1f2933;
    --ink-soft: #62707f;
    --ink-faint: #8c98a4;
    --bot-bubble: #eceff3;
    --user-bubble: #2c5f7c;
    --line: #dde2e8;
    --focus: #2c5f7c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }
  .shell {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4a9d6e; flex: none; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header span { font-size: 14px; color: var(--ink-soft); }

  #stream {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 14px; white-space: pre-wrap; }
  .bot  { background: var(--bot-bubble); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--user-bubble); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.intro { max-width: 100%; }

  .typing { display: flex; gap: 5px; align-self: flex-start;
            background: var(--bot-bubble); padding: 15px 16px; border-radius: 14px;
            border-bottom-left-radius: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint);
              animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .28 } 30% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .5 } }

  footer { flex: none; border-top: 1px solid var(--line); padding: 16px 24px 20px; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  #entry {
    flex: 1 1 auto; font: inherit; color: var(--ink);
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; min-width: 0;
  }
  #entry:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid transparent; }
  #send { background: var(--user-bubble); color: #fff; padding: 12px 22px; font-weight: 600; }
  #skip { background: #fff; color: var(--ink-soft); border-color: var(--line); padding: 12px 18px; }
  #skip:hover:not(:disabled) { background: #f7f8fa; color: var(--ink); }
  button:disabled, #entry:disabled { opacity: .45; cursor: default; }
  .hint { margin: 10px 2px 0; font-size: 13.5px; color: var(--ink-faint); }

  .endbox { border-top: 1px solid var(--line); padding: 20px 24px 24px; flex: none; }
  .cta { display: inline-block; background: var(--user-bubble); color: #fff;
         padding: 14px 26px; border-radius: 10px; text-decoration: none; font-weight: 600; }
  .cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  details { margin-top: 16px; font-size: 14px; color: var(--ink-soft); }
  summary { cursor: pointer; }
  #fallback { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace;
              font-size: 12px; margin-top: 10px; padding: 10px; border: 1px solid var(--line);
              border-radius: 8px; resize: vertical; color: var(--ink-soft); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main class="shell">
  <header>
    <span class="dot" aria-hidden="true"></span>
    <h1>Assistant</h1>
    <span>Online</span>
  </header>

  <div id="stream" role="log" aria-live="polite" aria-label="Conversation"></div>

  <footer id="composer">
    <div class="row">
      <label for="entry" class="hidden">Your message</label>
      <input id="entry" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="send"
             placeholder="Type your message">
      <button id="skip" type="button" disabled>Skip</button>
      <button id="send" type="button">Send</button>
    </div>
    <p class="hint">Type STOP at any point to end the study.</p>
  </footer>

  <section id="endbox" class="endbox hidden">
    <a id="cta" class="cta" href="#">Continue</a>
    <details id="fallbackWrap" class="hidden">
      <summary>The button did not work</summary>
      <p>Copy the text below and paste it into the first question of the next page.</p>
      <textarea id="fallback" rows="3" readonly></textarea>
    </details>
  </section>
</main>

<script>
"use strict";

/* ======================= CONFIG - fill these in ======================= */
const CONFIG = {
  // QuestionPro survey the participant continues to.
  surveyUrl: "https://uniofbath.questionpro.eu/modalitychatbot",

  // No Prolific link here on purpose. Completers reach Prolific from the end of
  // the QuestionPro survey. Withdrawers are told to return the study themselves,
  // because withdrawal during the sensitive questions is unpaid.

  // URL parameter carrying the Prolific ID into this page.
  inboundIdParam: "PROLIFIC_PID",

  // Custom variable codes defined in QuestionPro. Case sensitive.
  // All prefixed cb_ because QuestionPro reserves some short codes for its own
  // use (pid, mode, pl, pt, rt, tt and others; their published list is explicitly
  // not exhaustive). A reserved code silently conflicts, so the prefix avoids
  // the whole problem.
  vars: {
    pid: "cb_pid", cond: "cb_cond", t0: "cb_t0", fin: "cb_fin",
    dis: "cb_dis", skp: "cb_skp", rep: "cb_rep", lat: "cb_lat", hsh: "cb_hsh",
    ref: "cb_ref", len: "cb_len",
    nstop: "cb_nstop", done: "cb_done",
    att: "cb_att", attlat: "cb_attlat",
    att1: "cb_att1", att2: "cb_att2", att3: "cb_att3"
  },

  hashChars: 16,     // hex chars kept per answer. Do not exceed 24 (512 char cap).
  typingMs: [450, 900]
};

/* ======================= SCRIPT (from the workbook) ======================= */
const SCRIPT = {
  // Delivered one after another on load. The participant cannot reply until
  // all of them have appeared.
  INTRO: [
    'Hi, I am a chatbot. Welcome! In this part, I will ask you some questions. ' +
    'Please reply only with the answer to the question.',

    'If you do not want to answer a question, select Skip or type "Skip".',

    'If you at any point want to withdraw your consent and stop the study, you can ' +
    'close the window or type in "STOP" and I will deactivate. None of your progress ' +
    'will be saved. It will also mean I will not respond again and you will not be ' +
    'able to continue this conversation.',

    'I will let you know when the questions are done and give you instructions to ' +
    'continue with the study.',

    'Please type "START" whenever you are ready to begin.'
  ],
  AWAIT_START:   'Please type START when you are ready to begin.',
  BEGIN:         'Thank you. I will now begin. Here is the first question.',
  EMPTY:         'I did not receive an answer. Please type your answer, or select Skip if you would prefer not to answer.',
  SKIP_ACK:      'That is fine. Moving on to the next question.',
  ANSWER_ACK:    'Thank you.',
  STOP_CONFIRM:  'Do you want to stop the study? Type YES to stop, or type CONTINUE to carry on.',
  STOP_FINAL:    'The study has ended. It was looking at how people decide what personal information to share. None of your answers have been saved, and nothing you typed has been stored anywhere. Thank you for your time. You can now close this window.',
  COMPLETE:      'That is the last question. Thank you. Please select the link below to complete the final part of the study.'
};

/* ======================= TREE (21 questions, fixed order) ======================= */
const TREE = [
  "What is your gender?",
  "What is your primary field of work/study?",
  "What is your highest level of education completed?",
  "What was the name of your first pet?",
  "What is your age?",
  "Do you have any dependants (children, or adults you care for)?",
  "What is your current employment status?",
  "What is your marital status?",
  "Do you own or rent your home?",
  "How many people live in your household, including yourself?",
  "Do you use online banking?",
  "In what city were you born?",
  "What was the name of your primary school?",
  "Do you have savings or investments (either or both)?",
  "What is the name of your main bank?",
  "Do you have any ongoing health conditions?",
  "What is your mother's maiden name?",
  "What is your annual household income range?",
  "What are the last 4 digits of your debit/credit card?",
  "What is your online banking username?",
  "What is your telephone's PIN password?"
];
const N = TREE.length;

/* ======================= ATTENTION CHECKS =======================
   These sit BETWEEN questions and are deliberately kept out of the 21-position
   encoding, so dis / skp / rep / lat / hsh stay indexed by question number.
   "after" is the 1-based question number the check follows.
   Answers are NOT hashed: they are not sensitive, and keeping the normalised
   text lets you audit the grading rule rather than trusting it blind.
   ============================================================== */
const ATTENTION = [
  { after: 7,  prompt: "What is 7+8?",                     accept: ["15", "fifteen"] },
  { after: 14, prompt: "To check the system is recording your answers correctly, please type the word 'blue' in this box.", accept: ["blue"] },
  { after: 17, prompt: "How many days are there in a week?", accept: ["7", "seven"] }
];
const A = ATTENTION.length;

/* ======================= COMMAND MATCHING ======================= */
// Word boundaries, so "I'd rather skip this" matches but "Skippy" does not.
const SKIP_RE  = /\bskip\b/i;
const STOP_RE  = /\bstop\b/i;
const isExact  = (t, w) => t.trim().toLowerCase() === w;

/* ======================= REFUSAL DETECTION =======================
   Some participants decline by writing a non-answer ("no", "rather not say")
   instead of using Skip. Because answers are hashed at entry and the plaintext
   is never transmitted, this CANNOT be coded afterwards: if it is not caught
   here, it is lost. So the text is tested at the moment of entry and only a
   flag travels.

   The answer is still recorded as disclosed and still hashed. The flag is
   advisory, so disclosure can be reported both ways: counting these as
   disclosures, and counting them as refusals.

   NOTHING about the participant's experience changes. No re-prompt, no
   different acknowledgement. The flag is silent.

   The list is FIXED IN ADVANCE and must not be adjusted after seeing the data.
   The same list must be applied to the other arms.
   ================================================================= */

// Questions where a bare negative is a legitimate answer, so "no" there is a
// real response rather than a refusal. 1-indexed. CONFIRM THIS LIST.
//   6  Do you have any dependants (children, or adults you care for)?
//   (Q10 is NOT in this list. It was reworded on 21 Oct 2026 from the
//   double-barrelled "Do you live alone / number of people in household?" to
//   "How many people live in your household, including yourself?", which
//   expects a count. A bare "no" is therefore no longer an answer to it and is
//   flagged as a refusal. Confirmed by Lucija, 21 Oct 2026.)
//   11 Do you use online banking?
//   14 Do you have savings or investments (either or both)?
//   16 Do you have any ongoing health conditions?
// Confirmed by Lucija, 21 Oct 2026.
const NO_IS_VALID = [6, 11, 14, 16];

// Tier A: whole-answer matches only, so "private sector" at Q07 and "none of
// the above" style answers are not caught by the bare word.
const REFUSAL_EXACT = [
  "no", "nope", "nah", "none", "nothing", "na", "n/a", "n.a.",
  "private", "confidential", "secret", "personal",
  "decline", "declined", "refuse", "refused", "pass",
  "x", "xx", "xxx", "-", "--", ".", "?", "???"
];
// The bare-negative subset, allowed through on NO_IS_VALID questions.
const BARE_NEGATIVE = ["no", "nope", "nah", "none", "nothing"];

// Tier B: phrases, matched anywhere in the normalised answer.
const REFUSAL_PHRASES = [
  "rather not", "prefer not", "not saying", "wont say", "will not say",
  "not telling", "not tell you", "no comment", "not comfortable",
  "not disclosing", "not disclose", "dont want to", "do not want to",
  "none of your business", "mind your own", "not answering",
  "not sharing", "not share that", "why do you need", "not relevant",
  "none of yours", "no way", "not happening"
];

// Returns 1 if the answer looks like a refusal rather than a response.
function isRefusal(text, questionNumber) {
  const flat = text.toLowerCase().replace(/[^a-z0-9/.\s]/g, "").trim();
  const squashed = flat.replace(/\s+/g, " ");
  const noAllowed = NO_IS_VALID.includes(questionNumber);

  if (REFUSAL_EXACT.includes(squashed)) {
    if (noAllowed && BARE_NEGATIVE.includes(squashed)) return 0;
    return 1;
  }
  return REFUSAL_PHRASES.some(p => squashed.includes(p)) ? 1 : 0;
}

/* ======================= STATE ======================= */
const STATE = { AWAIT_START: 0, ASKING: 1, CONFIRM_STOP: 2, DONE: 3, DEAD: 4, BOOTING: 5, ATTENTION: 6 };

const results = {
  pid: new URLSearchParams(location.search).get(CONFIG.inboundIdParam) || "",
  t0: 0,
  stopAttempts: 0,
  dis: Array(N).fill(0),
  skp: Array(N).fill("n"),
  rep: Array(N).fill(0),
  lat: Array(N).fill(0),
  hsh: Array(N).fill("0".repeat(CONFIG.hashChars)),
  ref: Array(N).fill(0),        // 1 = answer looked like a refusal
  len: Array(N).fill(0),        // characters typed, 0 if not answered
  att: Array(A).fill("x"),      // 1 pass, 0 fail, s skipped, x not reached
  attTxt: Array(A).fill(""),    // normalised answer, for auditing the grading
  attLat: Array(A).fill(0)
};

let pendingCheck = null;      // attention check awaiting a reply
let attShownAt = 0;

let state = STATE.BOOTING;
let idx = 0;          // index of the question currently on the table
let shownAt = 0;      // when the current question was rendered
let busy = false;     // true while the bot is "typing"

const stream = document.getElementById("stream");
const entry  = document.getElementById("entry");
const sendBtn = document.getElementById("send");
const skipBtn = document.getElementById("skip");
const composer = document.getElementById("composer");
const endbox = document.getElementById("endbox");
const cta = document.getElementById("cta");

/* ======================= RENDERING ======================= */
function bubble(text, who, extraClass) {
  const el = document.createElement("div");
  el.className = "msg " + who + (extraClass ? " " + extraClass : "");
  el.textContent = text;
  stream.appendChild(el);
  stream.scrollTop = stream.scrollHeight;
  return el;
}

function typingDelay() {
  const [lo, hi] = CONFIG.typingMs;
  return lo + Math.random() * (hi - lo);
}

// Queue a bot message behind a typing indicator.
function say(text, extraClass) {
  return new Promise(resolve => {
    busy = true; setControls();
    const dots = document.createElement("div");
    dots.className = "typing";
    dots.innerHTML = "<i></i><i></i><i></i>";
    stream.appendChild(dots);
    stream.scrollTop = stream.scrollHeight;
    setTimeout(() => {
      dots.remove();
      bubble(text, "bot", extraClass);
      busy = false; setControls();
      resolve();
    }, typingDelay());
  });
}

function setControls() {
  const dead = (state === STATE.DEAD || state === STATE.DONE);
  const locked = dead || busy || state === STATE.BOOTING;
  entry.disabled   = locked;
  sendBtn.disabled = locked;
  skipBtn.disabled = locked || (state !== STATE.ASKING && state !== STATE.ATTENTION);
  if (!locked) entry.focus();
}

/* ======================= HASHING =======================
   A random salt is generated when the page loads, combined with every answer,
   and never transmitted or stored. Without it, answers to questions with few
   possible values (yes/no, age, a four digit PIN) could be recovered from the
   hash by trying every candidate. The salt makes that impossible.

   Because the same salt is used for all 21 answers by the same participant,
   identical answers still produce identical hashes WITHIN a response, so
   straightlining is still detectable. Hashes are NOT comparable between
   participants, which is intended.
   ====================================================== */
const SESSION_SALT = (() => {
  const raw = new Uint8Array(16);
  crypto.getRandomValues(raw);
  return Array.from(raw).map(b => b.toString(16).padStart(2, "0")).join("");
})();

async function hash16(plain) {
  const bytes = new TextEncoder().encode(SESSION_SALT + "|" + plain);
  const buf = await crypto.subtle.digest("SHA-256", bytes);
  const hex = Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0")).join("");
  return hex.slice(0, CONFIG.hashChars);
}

/* ======================= ATTENTION CHECK GRADING ======================= */
// Grade on tokens, so "It's 15" passes but "17" does not pass a "7" target.
function tokens(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(" ").filter(Boolean);
}
function gradeCheck(check, text) {
  const t = tokens(text);
  return check.accept.some(a => t.includes(a)) ? "1" : "0";
}
function storeText(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 40);  // alphanumeric only
}

/* ======================= FLOW ======================= */
async function askCurrent() {
  await say(TREE[idx]);
  shownAt = performance.now();
  state = STATE.ASKING;
  setControls();
}

async function askCheck(check) {
  pendingCheck = check;
  state = STATE.ATTENTION;
  await say(check.prompt);
  attShownAt = performance.now();
  state = STATE.ATTENTION;
  setControls();
}

function stampLatency() {
  const ms = Math.round(performance.now() - shownAt);
  results.lat[idx] = Math.max(0, Math.min(999999, ms));
}

async function nextQuestion() {
  idx += 1;
  if (idx >= N) { await finish(); return; }
  await askCurrent();
}

// Called after a question has been recorded. Runs an attention check first if
// one is due after the question just completed.
async function advance() {
  const justDone = idx + 1;                       // 1-based question number
  const due = ATTENTION.find(c => c.after === justDone && results.att[ATTENTION.indexOf(c)] === "x");
  if (due) { await askCheck(due); return; }       // idx does not move yet
  await nextQuestion();
}

async function recordCheck(verdict, text) {
  const i = ATTENTION.indexOf(pendingCheck);
  results.att[i] = verdict;
  results.attTxt[i] = text ? storeText(text) : "";
  results.attLat[i] = Math.max(0, Math.min(999999, Math.round(performance.now() - attShownAt)));
  pendingCheck = null;
  // No feedback on a failed check. The bot reacts exactly as it would to any
  // other answer, so the experience does not change mid-task.
  await say(verdict === "s" ? SCRIPT.SKIP_ACK : SCRIPT.ANSWER_ACK);
  await nextQuestion();
}

async function recordAnswer(text) {
  stampLatency();
  results.dis[idx] = 1;
  results.skp[idx] = "n";
  // Tested here, while the plaintext still exists. Silent: the participant
  // sees the same acknowledgement either way.
  results.ref[idx] = isRefusal(text, idx + 1);
  // Length only, never the content. Lets an implausible answer (2 characters
  // for a maiden name, 30 for an age) be spotted in analysis without having
  // had to anticipate it, and without storing anything sensitive.
  results.len[idx] = Math.min(99, text.length);
  results.hsh[idx] = await hash16(text);
  await say(SCRIPT.ANSWER_ACK);
  await advance();
}

async function recordSkip(method) {
  stampLatency();
  results.dis[idx] = 0;
  results.skp[idx] = method;         // b, e or s
  results.hsh[idx] = "0".repeat(CONFIG.hashChars);
  await say(SCRIPT.SKIP_ACK);
  await advance();
}

/* ======================= ENCODING AND EXIT ======================= */
// Fields that can come out as all digits get a leading "X", so no spreadsheet
// or CSV reader can mistake them for numbers (Excel would otherwise drop
// leading zeros and shift every position, or turn long strings into
// scientific notation). To unpack: drop the first character.
const X = s => "X" + s;

function buildQuery() {
  const v = CONFIG.vars;
  const p = new URLSearchParams();
  p.set(v.pid,   results.pid);
  p.set(v.cond,  "chatbot");
  p.set(v.t0,    X(String(results.t0)));
  p.set(v.fin,   X(String(Date.now())));
  p.set(v.dis,   X(results.dis.join("")));
  p.set(v.skp,   results.skp.join(""));
  p.set(v.rep,   X(results.rep.map(n => Math.min(9, n)).join("")));
  p.set(v.lat,   X(results.lat.map(n => String(n).padStart(6, "0")).join("")));
  p.set(v.hsh,   X(results.hsh.join("")));
  p.set(v.ref,   X(results.ref.join("")));
  p.set(v.len,   X(results.len.map(n => String(n).padStart(2, "0")).join("")));
  p.set(v.nstop, String(results.stopAttempts));
  p.set(v.done,  "1");
  p.set(v.att,    X(results.att.join("")));
  p.set(v.attlat, X(results.attLat.map(n => String(n).padStart(6, "0")).join("")));
  results.attTxt.forEach((t, i) => p.set(v["att" + (i + 1)], t));
  return p.toString();
}

async function finish() {
  state = STATE.DONE;
  setControls();
  await say(SCRIPT.COMPLETE);
  const url = CONFIG.surveyUrl + (CONFIG.surveyUrl.includes("?") ? "&" : "?") + buildQuery();
  cta.href = url;
  cta.textContent = "Continue to the final part";
  composer.classList.add("hidden");
  endbox.classList.remove("hidden");
  // Fallback in case the link does not carry: the participant can paste the
  // encoded string into the first question of the survey instead.
  document.getElementById("fallbackWrap").classList.remove("hidden");
  document.getElementById("fallback").value = buildQuery();
  cta.focus();
}

async function kill() {
  // Discard everything. Nothing was ever transmitted, so nothing persists.
  for (const k of ["dis", "skp", "rep", "lat", "hsh", "att", "attTxt", "attLat"]) results[k] = [];
  results.pid = "";
  state = STATE.DEAD;
  setControls();
  await say(SCRIPT.STOP_FINAL);
  // No link out. Withdrawal during the sensitive questions is unpaid. The
  // participant simply closes the window and the submission times out on
  // Prolific, which does not affect their account standing. A completion link
  // here would mark them as finished and trigger payment.
  composer.classList.add("hidden");
}

/* ======================= INPUT HANDLING ======================= */
async function handle(raw) {
  const text = raw.trim();

  if (state === STATE.DEAD || state === STATE.DONE) return;   // bot is silent

  /* --- stop confirmation --- */
  if (state === STATE.CONFIRM_STOP) {
    if (isExact(text, "yes")) { await kill(); return; }
    if (isExact(text, "continue")) {
      results.stopAttempts += 1;      // raised and withdrawn
      if (pendingCheck) { await askCheck(pendingCheck); return; }
      state = STATE.ASKING;
      await askCurrent();
      return;
    }
    await say(SCRIPT.STOP_CONFIRM);
    return;
  }

  /* --- STOP is live everywhere, including before START --- */
  if (STOP_RE.test(text)) {
    if (state === STATE.ASKING) {
      // Record the pending question as unanswered so nothing is lost either way.
      stampLatency();
      results.dis[idx] = 0;
      results.skp[idx] = "n";
    }
    state = STATE.CONFIRM_STOP;
    await say(SCRIPT.STOP_CONFIRM);
    return;
  }

  /* --- before the sequence opens --- */
  if (state === STATE.AWAIT_START) {
    if (isExact(text, "start")) {
      results.t0 = Date.now();
      await say(SCRIPT.BEGIN);
      idx = 0;
      await askCurrent();
    } else {
      await say(SCRIPT.AWAIT_START);
    }
    return;
  }

  /* --- attention check --- */
  if (state === STATE.ATTENTION) {
    if (text === "") { await say(SCRIPT.EMPTY); return; }
    if (SKIP_RE.test(text)) { await recordCheck("s", ""); return; }
    await recordCheck(gradeCheck(pendingCheck, text), text);
    return;
  }

  /* --- answering a question --- */
  if (state === STATE.ASKING) {
    if (text === "") {
      results.rep[idx] += 1;
      await say(SCRIPT.EMPTY);
      return;
    }
    if (SKIP_RE.test(text)) {
      await recordSkip(isExact(text, "skip") ? "e" : "s");
      return;
    }
    await recordAnswer(text);
  }
}

function submit() {
  if (busy || entry.disabled) return;
  const raw = entry.value;
  if (raw.trim() !== "") bubble(raw.trim(), "user");
  entry.value = "";
  handle(raw);
}

sendBtn.addEventListener("click", submit);
entry.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); submit(); }
});
skipBtn.addEventListener("click", async () => {
  if (busy) return;
  if (state === STATE.ATTENTION) { bubble("Skip", "user"); await recordCheck("s", ""); return; }
  if (state !== STATE.ASKING) return;
  bubble("Skip", "user");
  await recordSkip("b");
});

/* ======================= BOOT ======================= */
const wait = ms => new Promise(r => setTimeout(r, ms));

(async function boot() {
  if (!window.crypto || !crypto.subtle) {
    bubble("This page needs to be opened over https or localhost. Please contact the researcher.", "bot");
    entry.disabled = sendBtn.disabled = skipBtn.disabled = true;
    return;
  }
  setControls();                       // locked while BOOTING
  for (let i = 0; i < SCRIPT.INTRO.length; i++) {
    await say(SCRIPT.INTRO[i], "intro");
    if (i < SCRIPT.INTRO.length - 1) {
      // Pause in proportion to how much there was to read, so the longer
      // messages are not buried by the next one arriving.
      await wait(Math.min(2600, 600 + SCRIPT.INTRO[i].length * 7));
    }
  }
  state = STATE.AWAIT_START;
  setControls();
})();
</script>
